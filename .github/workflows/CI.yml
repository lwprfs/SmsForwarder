name: CI Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Cache Gradle
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: ${{ runner.os }}-gradle-

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Decode Keystore file
      run: |
        mkdir -p app/key
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/key/mykey.jks

    - name: Create keystore.properties from Secrets
      run: |
        mkdir -p keystore
        cat > keystore/keystore.properties <<EOF
        storeFile=${{ github.workspace }}/app/key/mykey.jks
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        EOF

    - name: Validate keystore
      run: |
        echo "--- Detecting keystore type ---"
        keytool -list \
          -keystore app/key/mykey.jks \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
          -alias "${{ secrets.KEY_ALIAS }}"

        echo "--- Trying to load private key with keyPassword ---"
        cat > /tmp/CheckKey.java <<'JAVA'
        import java.io.FileInputStream;
        import java.security.KeyStore;

        public class CheckKey {
          public static void main(String[] args) throws Exception {
            String path     = args[0];
            char[] storePwd = args[1].toCharArray();
            char[] keyPwd   = args[2].toCharArray();
            String alias    = args[3];

            KeyStore ks = KeyStore.getInstance("PKCS12");
            try (FileInputStream fis = new FileInputStream(path)) {
              ks.load(fis, storePwd);
            }
            java.security.Key key = ks.getKey(alias, keyPwd);
            if (key == null) {
              System.err.println("❌ Key is null (bad alias?)");
              System.exit(1);
            }
            System.out.println("✅ Key loaded OK. Algorithm: " + key.getAlgorithm());
          }
        }
        JAVA

        javac /tmp/CheckKey.java
        java -cp /tmp CheckKey \
          app/key/mykey.jks \
          "${{ secrets.KEYSTORE_PASSWORD }}" \
          "${{ secrets.KEY_PASSWORD }}" \
          "${{ secrets.KEY_ALIAS }}"

    - name: Verify keystore and properties
      run: |
        echo "--- keystore directory ---"
        ls -la app/key/
        echo "--- keystore.properties ---"
        cat keystore/keystore.properties

    - name: Build arm64-v8a Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Find and Upload APK
      run: |
        echo "Looking for APK in all possible locations..."
        find . -name "*.apk" -type f
        echo ""
        echo "Looking in build/outputs folder..."
        ls -la build/app/outputs/apk/release/ || echo "Path not found"
        echo ""
        echo "Looking in app/build/outputs folder..."
        ls -la app/build/outputs/apk/release/ || echo "Path not found"

        APK_PATH=$(find . -name "*arm64-v8a*release.apk" -type f | head -1)
        if [ -z "$APK_PATH" ]; then
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
        fi
        if [ -n "$APK_PATH" ]; then
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"
          mkdir -p apk_upload
          cp "$APK_PATH" apk_upload/
        else
          echo "No APK found!"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SmsForwarder_arm64-v8a_release
        path: apk_upload/*.apk
        retention-days: 30